name: Buildchain Web Surface

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      production_approved:
        description: "Apply the gated production channel for trusted manual dispatch"
        type: boolean
        required: false
        default: false
      activation_source_sha:
        description: "Exact reviewed site commit selected by the upstream activation transaction"
        type: string
        required: false
        default: ""
      activation_environment:
        description: "Activation target; production is required when production_approved is true"
        type: choice
        required: false
        default: "shadow"
        options:
          - shadow
          - production
      activation_transaction_root:
        description: "sha256 root of the upstream Buildchain activation transaction"
        type: string
        required: false
        default: ""

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  id-token: write
  pull-requests: write

jobs:
  activation-input-gate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate exact activation coordinates
        env:
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          ACTIVATION_SOURCE_SHA: ${{ inputs.activation_source_sha }}
          GITHUB_SHA: ${{ github.sha }}
          ACTIVATION_ENVIRONMENT: ${{ inputs.activation_environment }}
          ACTIVATION_TRANSACTION_ROOT: ${{ inputs.activation_transaction_root }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PRODUCTION_APPROVED" = "true" ]; then
            [[ "$ACTIVATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::production activation requires an exact reviewed activation_source_sha"
              exit 1
            }
            [ "$ACTIVATION_SOURCE_SHA" = "$GITHUB_SHA" ] || {
              echo "::error::production activation requires activation_source_sha to equal github.sha"
              exit 1
            }
            [ "$ACTIVATION_ENVIRONMENT" = "production" ] || {
              echo "::error::production approval requires activation_environment=production"
              exit 1
            }
            [[ "$ACTIVATION_TRANSACTION_ROOT" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::production activation requires activation_transaction_root"
              exit 1
            }
          elif [ -n "$ACTIVATION_SOURCE_SHA" ] || [ -n "$ACTIVATION_TRANSACTION_ROOT" ]; then
            [ "$ACTIVATION_ENVIRONMENT" = "shadow" ] || {
              echo "::error::non-production activation coordinates must remain shadow"
              exit 1
            }
          fi

  github-governance-receipt:
    needs:
      - activation-input-gate
    if: >-
      ${{
        always() &&
        (needs.activation-input-gate.result == 'success' || needs.activation-input-gate.result == 'skipped') &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.production_approved) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (
            github.event_name == 'pull_request' &&
            github.event.action == 'closed' &&
            github.event.pull_request.merged == true &&
            contains(github.event.pull_request.labels.*.name, 'buildchain-release')
          )
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      receipt-json: ${{ steps.receipt.outputs.receipt-json }}
    steps:
      - name: Checkout exact Buildchain governance verifier
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: 5f4c48f802f7463237e6e612fb238c08bdd31a26
          path: .buildchain/governance-runtime
          persist-credentials: false

      - name: Resolve exact Buildchain governance verifier
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_sha="$(git -C .buildchain/governance-runtime rev-parse HEAD)"
          if [ "$runtime_sha" != "5f4c48f802f7463237e6e612fb238c08bdd31a26" ]; then
            echo "::error::governance verifier does not match the exact Buildchain release runtime"
            exit 1
          fi
          echo "sha=$runtime_sha" >> "$GITHUB_OUTPUT"

      - name: Mint bounded governance auditor token
        id: auditor
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.KUNGFU_GOVERNANCE_AUDITOR_APP_ID }}
          private-key: ${{ secrets.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Collect exact live governance receipt
        env:
          GH_TOKEN: ${{ steps.auditor.outputs.token }}
          BUILDCHAIN_RUNTIME_SHA: ${{ steps.runtime.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node .buildchain/governance-runtime/scripts/audit-github-governance.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --target-ref main \
            --source-revision "$BUILDCHAIN_RUNTIME_SHA" \
            --output .buildchain/github-governance-audit.json \
            --require-qualifying

      - name: Export one fresh qualifying receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt_count="$(jq '.receipts | length' .buildchain/github-governance-audit.json)"
          if [[ "$receipt_count" != "1" ]]; then
            echo "::error::expected exactly one GitHub governance receipt, found $receipt_count"
            exit 1
          fi
          echo "receipt-json=$(jq -c '.receipts[0]' .buildchain/github-governance-audit.json)" >> "$GITHUB_OUTPUT"

  web-surface:
    needs:
      - activation-input-gate
      - github-governance-receipt
    if: >-
      ${{
        always() &&
        (
          needs.activation-input-gate.result == 'success' ||
          needs.activation-input-gate.result == 'skipped'
        ) &&
        (
          needs.github-governance-receipt.result == 'success' ||
          needs.github-governance-receipt.result == 'skipped'
        )
      }}
    uses: kungfu-systems/buildchain/.github/workflows/.web-surface.yml@5f4c48f802f7463237e6e612fb238c08bdd31a26
    with:
      buildchain-contract-lock-path: ${{ (((github.event_name == 'workflow_dispatch' && inputs.production_approved) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'buildchain-release')))) && '.buildchain/contract-lock.json' || '.buildchain/alpha-contract-lock.json' }}
      buildchain-contract-compatibility-policy: major-compatible
      buildchain-contract-drift-issue-mode: compatible-and-breaking
      node-version: "24"
      build-command: pnpm run build
      verify-command: pnpm run check
      artifact-path: dist
      preview-apply: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      preview-cleanup-apply: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      preview-aws-role-arn: arn:aws:iam::727884401362:role/site-kungfu-tech-preview-github-actions
      staging-apply: true
      staging-aws-role-arn: arn:aws:iam::727884401362:role/site-kungfu-tech-staging-github-actions
      production-apply: true
      production-approved: ${{ github.event_name == 'workflow_dispatch' && inputs.production_approved }}
      production-release-on-main: true
      production-release-app-client-id: ${{ vars.KUNGFU_RELEASE_APP_CLIENT_ID }}
      production-release-label: buildchain-release
      production-release-head-prefix: feature/release-
      production-aws-role-arn: arn:aws:iam::727884401362:role/site-kungfu-tech-production-github-actions
      production-environment: production
      github-governance-receipt-json: ${{ needs.github-governance-receipt.outputs.receipt-json || '' }}
    secrets:
      production-release-app-private-key: ${{ secrets.KUNGFU_RELEASE_APP_PRIVATE_KEY }}
