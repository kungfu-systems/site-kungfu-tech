<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditable artifact demo | Kungfu</title>
  <meta name="description" content="Watch and inspect a bounded demo rendered from the exact installed Kungfu Linux artifact.">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    main { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 56px; }
    .demo-player, .coordinates { display: grid; gap: 22px; padding-top: 42px; }
    .eyebrow { margin: 0; color: var(--accent); font-size: 14px; font-weight: 700; text-transform: uppercase; }
    h1 { max-width: 820px; margin: 8px 0 18px; font-size: clamp(42px, 7vw, 76px); line-height: 1; }
    .lead { max-width: 800px; margin: 0; color: var(--muted); font-size: 21px; }
    video { width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--line); background: #0d1117; }
    .fallback, .retention-note { margin: 0; color: var(--muted); }
    .proof-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
    .proof-grid article { padding: 18px; border: 1px solid var(--line); background: var(--surface); }
    .proof-grid h2, .proof-grid p { margin: 0; }
    .proof-grid h2 { margin-bottom: 8px; font-size: 20px; }
    .proof-grid p { color: var(--muted); }
    .coordinates { margin-top: 28px; padding: 24px; border-left: 3px solid var(--accent); background: var(--surface); }
    .coordinates h2 { margin: 0; }
    dl { display: grid; gap: 12px; margin: 0; }
    dl div { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; }
    dt { color: var(--muted); }
    dd { min-width: 0; margin: 0; }
    code { overflow-wrap: anywhere; }
    .evidence-links { display: flex; flex-wrap: wrap; gap: 12px 20px; }
    @media (max-width: 680px) {
      main { width: min(100% - 28px, 560px); padding-top: 28px; }
      .proof-grid { grid-template-columns: 1fr; }
      dl div { grid-template-columns: 1fr; gap: 2px; }
    }
    @media (prefers-reduced-motion: reduce) {
      video { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main>
    <!-- shared-header:start -->
    <header class="site-header"></header>
    <!-- shared-header:end -->

      <!-- auditable-demo-evidence:start -->
      <p>Auditable demo evidence has not been imported.</p>
      <!-- auditable-demo-evidence:end -->

    <!-- shared-footer:start -->
    <footer class="site-footer"></footer>
    <!-- shared-footer:end -->
  </main>
</body>
</html>
